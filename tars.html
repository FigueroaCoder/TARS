<script>
const $=s=>document.getElementById(s),enc=encodeURIComponent;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const j=async u=>(await fetch(u)).json();

try{Object.assign(cfg,JSON.parse(localStorage.getItem('jv')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('jv',JSON.stringify(cfg))}catch(e){}};

let curU=null,state='idle',speaking=false,listening=false,lastEnd=0,voices=[],rec=null,first=true;
const ST={idle:'EN ESPERA',listen:'ESCUCHANDO',speak:'HABLANDO'};

function log(w,t){const d=document.createElement('div');d.className=w;d.textContent=(w=='U'?'» ':'R: ')+t;$('log').append(d);$('log').scrollTop=1e9;while($('log').children.length>40)$('log').firstChild.remove()}
if(window.speechSynthesis){voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices()}
let tok=0,lastLang='es-MX',lastAns=null,lastQ='',imgs=[],lbI=0;
function speak(t,lang='es-MX',own){if(!own){tok++;log('J',t)}return new Promise(res=>{
 if(!window.speechSynthesis)return res();
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*_#]/g,''));u.lang=lang;
 const L=lang.toLowerCase(),v=voices.find(v=>v.lang.replace('_','-').toLowerCase()==L)||voices.find(v=>v.lang.toLowerCase().startsWith(L.slice(0,2)));
 if(v)u.voice=v;u.pitch=.5;u.rate=.92;curU=u;
 u.onstart=()=>{speaking=true;setState('speak')};
 let dn=false;const to=setTimeout(()=>fin(),Math.max(5000,t.length*120));const fin=()=>{if(dn)return;dn=true;clearTimeout(to);if(curU===u){speaking=false;lastEnd=Date.now();setState(listening?'listen':'idle')}res()};u.onend=u.onerror=fin;
 speechSynthesis.speak(u)})}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startRec(){
 if(!SR){speak('Su navegador no admite reconocimiento de voz. Use Chrome o Edge. Aún puede escribirme comandos.');return}
 listening=true;$('micB').classList.add('on');$('iM').classList.add('on');setState(speaking?'speak':'listen');if(rec)return;
 rec=new SR();rec.lang='es-MX';rec.continuous=true;rec.interimResults=true;
 let stp=false;
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i],x=r[0].transcript,nx=norm(x);
  if(nx.split(/\s+/).length<=4&&/^((rocafi|roca fi|oye|hey|ya) )*(detente|deten|detener|alto|basta|silencio|callate|cancela|stop|espera)\b/.test(nx)){if(!stp){stp=true;interrupt()}if(r.isFinal)stp=false;continue}
  if((speaking&&speechSynthesis.speaking)||Date.now()-lastEnd<700)continue;$('heard').textContent=x;if(r.isFinal)handle(x,true)}};
 rec.onend=()=>{rec=null;if(listening)setTimeout(startRec,300)};
 rec.onerror=e=>{if(/not-allowed/.test(e.error)){listening=false;$('micB').classList.remove('on');$('iM').classList.remove('on');setState('idle');card('<h3>Micrófono bloqueado</h3><p>Pulse el candado junto a la dirección, permita micrófono y cámara, y recargue la página.</p><p class="sm">Si abre el archivo directamente (file://), Chrome puede volver a preguntar en cada inicio. Es más estable abrirlo desde http://localhost.</p>');speak('Necesito permiso para usar el micrófono.')}else if(!['no-speech','aborted'].includes(e.error))$('heard').textContent='Error de voz: '+e.error};
 try{rec.start()}catch(e){}}
function stopRec(){listening=false;$('micB').classList.remove('on');$('iM').classList.remove('on');if(rec){rec.onend=null;try{rec.stop()}catch(e){}rec=null}setState('idle')}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},500)}catch(e){}}
function go(u,l){const web=/^(https?|blob):/.test(u);let ok=true;
 if(web)ok=!!window.open(u,'_blank');else{const a=document.createElement('a');a.href=u;a.click()}
 if(!ok||!web)card(`<h3> ${esc(l)}</h3><p>${web?'El navegador bloqueó la ventana emergente. Permítala para este archivo o pulse:':'Si no se abrió solo, pulse (el navegador puede pedir permiso):'}</p><a class="btn" target="_blank" href="${esc(u)}">Abrir ${esc(l)}</a>`);
 return speak('Abriendo '+l+'.')}
const APPS=`excel|ms-excel:|Excel
word|ms-word:|Word
power ?point|ms-powerpoint:|PowerPoint
outlook|outlook:|Outlook
onenote|onenote:|OneNote
teams|msteams:|Teams

spotify|spotify:|Spotify

steam|steam:|Steam
youtube|https://www.youtube.com|YouTube
gmail|https://mail.google.com|Gmail

google docs|https://docs.google.com/document/create|Google Docs

linkedin|https://www.linkedin.com|LinkedIn

mercado libre|https://www.mercadolibre.com.mx|Mercado Libre
traductor|https://translate.google.com|Traductor
noticias|https://news.google.com|Noticias
google|https://www.google.com|Google`.split('\n').map(l=>l.split('|'));
const WEB={Excel:'https://www.office.com/launch/excel',Word:'https://www.office.com/launch/word',PowerPoint:'https://www.office.com/launch/powerpoint'};
const WC={0:'despejado',1:'mayormente despejado',2:'parcialmente nublado',3:'nublado',45:'con niebla',48:'con niebla',51:'con llovizna',53:'con llovizna',55:'con llovizna fuerte',61:'con lluvia ligera',63:'con lluvia',65:'con lluvia fuerte',71:'con nieve',80:'con chubascos',81:'con chubascos',82:'con chubascos fuertes',95:'con tormenta',96:'con tormenta y granizo',99:'con tormenta y granizo'};
async function weather(city){let lat,lon,name=city;
 if(city){const g=await j('https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name='+enc(city)),r=g.results&&g.results[0];
  if(!r)return speak('No encontré la ciudad '+city+'.');lat=r.latitude;lon=r.longitude;name=r.name}
 else{try{const p=await new Promise((a,b)=>navigator.geolocation.getCurrentPosition(a,b,{timeout:8000}));lat=p.coords.latitude;lon=p.coords.longitude;name='su ubicación'}
  catch(e){return speak('No pude obtener su ubicación. Diga, por ejemplo: clima en Guadalajara, o configure su ciudad.')}}
 const w=await j(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
 const c=w.current,d=w.daily,ds=WC[c.weather_code]||'variable',R=Math.round;
 card(`<h3> ${esc(name)}</h3><div class="big">${R(c.temperature_2m)}°C</div><p>${ds}</p><p>Sensación ${R(c.apparent_temperature)}° · Humedad ${c.relative_humidity_2m}% · Viento ${R(c.wind_speed_10m)} km/h</p><p>Máx ${R(d.temperature_2m_max[0])}° · Mín ${R(d.temperature_2m_min[0])}° · Lluvia ${d.precipitation_probability_max[0]}%</p>`);
 return speak(`En ${name} hay ${R(c.temperature_2m)} grados, ${ds}. Máxima de ${R(d.temperature_2m_max[0])} y mínima de ${R(d.temperature_2m_min[0])}, con ${d.precipitation_probability_max[0]} por ciento de probabilidad de lluvia.`)}
const STOP=new Set('el la los las un una de del al y o en que es son fue sobre acerca para por con me te se lo le mas muy como cual cuales quien quienes donde cuando puedes puede podrias decir dime explica explicame cuentame hablame informacion investiga busca buscar averigua favor rocafi roca'.split(' '));
const keys=q=>norm(q).split(/[^a-z0-9ñ]+/).filter(w=>w.length>2&&!STOP.has(w));
function cleanQ(raw){return raw.replace(/^(por favor[,\s]*)?(oye |hey )?(rocafi[,\s]*)?/i,'').replace(/^(me\s+)?(puedes|podrias|puede)\s+(decir|explicar|buscar|investigar)(me)?\s*/i,'').replace(/^(dime|d[ií]game|expl[ií]came|cu[eé]ntame|h[aá]blame|busca|buscar|investiga|googlea|averigua|define)\s*/i,'').replace(/^(qu[eé]|qui[eé]n(es)?|cu[aá]l(es)?|d[oó]nde|cu[aá]ndo|c[oó]mo|para qu[eé])\s+(es|son|fue|fueron|est[aá]n?|queda|funciona|funcionan|sirve|sirven|significa)?\s*/i,'').replace(/^(informaci[oó]n |datos |todo )?(de |del |sobre |acerca de |en internet |en google )+/i,'').replace(/^(el|la|los|las|un|una)\s+/i,'').replace(/[?¿!¡.,]+/g,'').trim()}
let rest=[];
const jt=async(u,ms=7000)=>{const c=new AbortController(),x=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(x)}};
const wp=async(l,q)=>{const d=await jt(`https://${l}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${enc(q)}&gsrlimit=6&prop=extracts|pageimages|info&exintro=1&explaintext=1&exlimit=max&piprop=thumbnail&pithumbsize=520&inprop=url&format=json&origin=*`);return Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index).filter(p=>p.extract)};
const cm=async(q,n)=>{const d=await jt(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${enc(q)}&gsrlimit=${n}&prop=imageinfo&iiprop=url|mime&iiurlwidth=480&format=json&origin=*`);return Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index).map(p=>{const i=p.imageinfo&&p.imageinfo[0];return i&&/image\/(jpeg|png|webp)/.test(i.mime)&&i.thumburl?{u:i.thumburl,c:p.title.replace(/^File:/,'').replace(/\.\w+$/,'').replace(/_/g,' ')}:null}).filter(Boolean)};
const dd=q=>jt('https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&t=rocafi&q='+enc(q));
const sents=s=>s.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).filter(Boolean);
async function readLong(a,l='es-MX'){const k=++tok;lastAns={a,l};lastLang=l;log('J',a.join(' ').slice(0,300));for(const s of a){if(k!==tok)break;await speak(s,l,true)}}
const cont=()=>rest.length?readLong(rest.splice(0,4),lastLang):speak('Eso es todo lo que tengo sobre ese tema, '+addr()+'.');
const repeat=()=>lastAns?readLong(lastAns.a,lastAns.l):speak('Aún no tengo nada que repetir.');
function chime(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();g.gain.value=.05;o.connect(g);g.connect(a.destination);o.frequency.value=660;o.start();setTimeout(()=>{o.stop();a.close()},130)}catch(e){}}
function interrupt(){tok++;try{speechSynthesis.cancel()}catch(e){}speaking=false;lastEnd=Date.now()-300;setState(listening?'listen':'idle');$('heard').textContent='Detenido. Lo escucho…';chime();if(rec&&listening){try{rec.abort()}catch(e){}}else if(!listening&&SR)startRec()}
function clickCur(){if(!cam)return speak('Active la cámara y señale con el índice.');const e=document.elementFromPoint(cx,cy);if(e)e.click()}
const scrollP=d=>$('panel').scrollBy({top:d*$('panel').clientHeight*.7,behavior:'smooth'});
function openLb(k){if(!imgs.length)return speak('No hay imágenes en pantalla.');lbI=(k+imgs.length)%imgs.length;$('lbi').src=imgs[lbI].u;$('lbc').textContent=imgs[lbI].c+' ('+(lbI+1)+'/'+imgs.length+')';$('lb').classList.add('on');speak(imgs[lbI].c.slice(0,90))}
function lbNav(d){if(!$('lb').classList.contains('on'))return openLb(d>0?0:imgs.length-1);lbI=(lbI+d+imgs.length)%imgs.length;$('lbi').src=imgs[lbI].u;$('lbc').textContent=imgs[lbI].c+' ('+(lbI+1)+'/'+imgs.length+')'}
function closeLb(){$('lb').classList.remove('on')}
$('lbp').onclick=()=>lbNav(-1);$('lbn').onclick=()=>lbNav(1);$('lbx').onclick=closeLb;
const googleLast=()=>go(lastQ?'https://www.google.com/search?q='+enc(lastQ):'https://www.google.com','Google');
async function research(q,o={}){
 if(!q)return speak('No logré entender su consulta, '+addr()+'. ¿Puede repetirla?');
 lastQ=q;rest=[];const K=keys(q),Q=enc(q);
 card(`<h3>${esc(q)}</h3><p class="sm">Buscando información e imágenes…</p>`);
 const[a,b,c]=await Promise.allSettled([wp('es',q),dd(q),cm(q,o.imgs?16:8)]);
 const rel=p=>{const h=norm(p.title+' '+p.extract.slice(0,300));return K.length?K.filter(k=>h.includes(k)).length/K.length:1};
 let pages=a.status=='fulfilled'?a.value:[],lang='es-MX',src='Wikipedia',best=pages.map(p=>[rel(p),p]).filter(x=>x[0]>=.5).sort((x,y)=>y[0]-x[0]||x[1].index-y[1].index)[0];best=best&&best[1];
 const d=b.status=='fulfilled'?b.value:{},dt=d.AbstractText||d.Answer||d.Definition||'';
